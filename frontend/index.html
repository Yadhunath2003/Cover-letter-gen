<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cover Letter Generator</title>
  <style>
    body { font-family: Arial; max-width: 1000px; margin: 20px auto; padding: 0 12px; }
    textarea { width: 100%; height: 180px; }
    #out { height: 260px; }
    .row { display: flex; gap: 12px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
    button { padding: 10px 14px; cursor: pointer; }
    select, input { padding: 8px; }
  </style>
</head>
<body>
  <h2>Cover Letter Generator (MVP)</h2>

  <label>Resume (Markdown)</label>
  <textarea id="resume" placeholder="Paste resume markdown..."></textarea>

  <label>Job Description</label>
  <textarea id="jd" placeholder="Paste job description..."></textarea>

  <div class="row">
    <label>Style</label>
    <select id="style">
      <option value="concise">Concise</option>
      <option value="impact">Impact</option>
    </select>

    <button id="gen">Generate</button>
    <button id="pdf">Download PDF</button>
  </div>

  <label>Output (Markdown)</label>
  <textarea id="out" placeholder="Generated cover letter will appear here..."></textarea>

  <script src="app.js"></script>
</body>
</html>
