<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cover Letter Generator</title>
  <style>
    body { font-family: Arial; max-width: 1000px; margin: 20px auto; padding: 0 12px; }
    textarea { width: 100%; height: 400px; }
    .row { display: flex; gap: 12px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
    button { padding: 10px 14px; cursor: pointer; }
    select, input { padding: 8px; }
    .info { background: #f0f0f0; padding: 12px; border-radius: 6px; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>Cover Letter Generator</h2>

  <div class="info">
    <strong>📁 Data Source:</strong> Automatically reads from <code>data/resume.md</code> and <code>data/job_description.txt</code>
  </div>

  <div class="row">
    <label>Style</label>
    <select id="style">
      <option value="concise">Concise</option>
      <option value="impact">Impact</option>
    </select>

    <button id="gen">Generate Cover Letter</button>
    <button id="pdf">Download PDF</button>
  </div>

  <label>Generated Cover Letter (Markdown)</label>
  <textarea id="out" placeholder="Click 'Generate Cover Letter' to create your cover letter..."></textarea>

  <script src="app.js"></script>
</body>
</html>
